name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: mvn -B clean verify

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_K8S_DEPLOY == 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -eu
          mkdir -p $HOME/.kube
          if printf '%s' "$KUBE_CONFIG" | base64 --decode > $HOME/.kube/config.decoded 2>/dev/null && grep -q 'apiVersion:' $HOME/.kube/config.decoded; then
            mv $HOME/.kube/config.decoded $HOME/.kube/config
          else
            printf '%s' "$KUBE_CONFIG" > $HOME/.kube/config
            rm -f $HOME/.kube/config.decoded
          fi
          chmod 600 $HOME/.kube/config
          CURRENT_CONTEXT="$(kubectl config current-context 2>/dev/null || true)"
          if [ -z "$CURRENT_CONTEXT" ]; then
            CURRENT_CONTEXT="$(kubectl config get-contexts -o name | head -n 1)"
            if [ -z "$CURRENT_CONTEXT" ]; then
              echo "KUBE_CONFIG innehåller inga Kubernetes-contexts. Kontrollera GitHub Secret KUBE_CONFIG."
              exit 1
            fi
            kubectl config use-context "$CURRENT_CONTEXT"
          fi
          echo "Using Kubernetes context: $CURRENT_CONTEXT"
          kubectl cluster-info

      - name: Create MySQL secret
        run: |
          kubectl create secret generic mysql-secret \
            --from-literal=password="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Update deployment image
        run: |
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]'):sha-${GITHUB_SHA}"
          kubectl set image deployment/booking-service "booking-service=${IMAGE}"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mysql --timeout=180s
          kubectl rollout status deployment/booking-service --timeout=300s
