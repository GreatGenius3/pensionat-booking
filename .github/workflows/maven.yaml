name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package

      - name: Run tests
        run: mvn test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -eu
          mkdir -p $HOME/.kube
          if printf '%s' "$KUBE_CONFIG" | base64 --decode > $HOME/.kube/config.decoded 2>/dev/null && grep -q 'apiVersion:' $HOME/.kube/config.decoded; then
            mv $HOME/.kube/config.decoded $HOME/.kube/config
          else
            printf '%s' "$KUBE_CONFIG" > $HOME/.kube/config
            rm -f $HOME/.kube/config.decoded
          fi
          chmod 600 $HOME/.kube/config
          CURRENT_CONTEXT="$(kubectl config current-context 2>/dev/null || true)"
          if [ -z "$CURRENT_CONTEXT" ]; then
            CURRENT_CONTEXT="$(kubectl config get-contexts -o name | head -n 1)"
            if [ -z "$CURRENT_CONTEXT" ]; then
              echo "KUBE_CONFIG innehåller inga Kubernetes-contexts. Kontrollera GitHub Secret KUBE_CONFIG."
              exit 1
            fi
            kubectl config use-context "$CURRENT_CONTEXT"
          fi
          echo "Using Kubernetes context: $CURRENT_CONTEXT"
          kubectl cluster-info

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Update deployment image
        run: |
          IMAGE_NAME="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          kubectl set image deployment/booking-service booking-service=${{ env.REGISTRY }}/$IMAGE_NAME:latest

      - name: Wait for deployment
        run: kubectl rollout status deployment/booking-service --timeout=180s